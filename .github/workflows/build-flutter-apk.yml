name: Build Flutter Android APK & Verify Monorepo

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "android/**"
      - ".github/workflows/build-flutter-apk.yml"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build PresensiKu Flutter APK (Ubuntu Runner)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter SDK (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Bootstrap Android Gradle & Native Scaffolding (if not present)
        run: |
          if [ ! -f "android/gradlew" ]; then
            flutter create . --platforms=android --org id.presensiku.enterprise --project-name presensiku_mobile
          fi
          # Ensure test references PresensiKuApp instead of MyApp
          if [ -f "test/widget_test.dart" ]; then
            sed -i 's/MyApp/PresensiKuApp/g' test/widget_test.dart
          fi

      - name: Inject Custom PresensiKu Branding, Icons, Splash Screen & Cleartext Traffic
        run: |
          pip3 install pillow || true
          python3 generate_icons.py || true
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.CAMERA" "$MANIFEST"; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>' "$MANIFEST"
          fi
          if ! grep -q "android:usesCleartextTraffic" "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi
          sed -i 's/android:label="presensiku_mobile"/android:label="PresensiKu Enterprise"/' "$MANIFEST" || true

          # Inject Proguard Keep Rules for Plugins (SharedPreferences, Geolocator, MobileScanner)
          cat << 'EOF' > android/app/proguard-rules.pro
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -keep class io.flutter.plugins.sharedpreferences.** { *; }
          -dontwarn io.flutter.plugins.sharedpreferences.**
          -keep class kotlin.coroutines.** { *; }
          -keep class com.baseflow.geolocator.** { *; }
          -dontwarn com.baseflow.geolocator.**
          -keep class dev.steenbakker.mobile_scanner.** { *; }
          -dontwarn dev.steenbakker.mobile_scanner.**
          -keep class dev.fluttercommunity.plus.device_info.** { *; }
          -dontwarn dev.fluttercommunity.plus.device_info.**
          EOF

          if [ -f "android/app/build.gradle" ] && ! grep -q "proguard-rules.pro" "android/app/build.gradle"; then
            sed -i '/signingConfig = signingConfigs.debug/a \            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' "android/app/build.gradle" || true
            sed -i '/signingConfig signingConfigs.debug/a \            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"' "android/app/build.gradle" || true
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Analyze Dart Code
        run: flutter analyze --no-fatal-infos || true

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK (Siap Install Semua HP Android)
        run: flutter build apk --release

      - name: Upload Universal APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PresensiKu-Enterprise-Release-APK
          path: android/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
