name: presensiku_mobile
description: PresensiKu Enterprise - Aplikasi Presensi Pegawai Mobile (Flutter) dengan Geofencing GPS Anti-Fake GPS & Dynamic QR Scanner.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  geolocator: ^13.0.1
  mobile_scanner: ^5.2.3
  intl: ^0.19.0
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
